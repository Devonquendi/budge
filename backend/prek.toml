[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.7"
hooks = [
    { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },
    { id = "ruff-format", types_or = ["python", "pyi"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
# Keep agent skills in sync with project dependencies
id = "library-skills"
name = "sync agent skills"
entry = "uvx --from library-skills library-skills install --claude --all --yes"
language = "system"
pass_filenames = false
files = '(pyproject\.toml|uv\.lock)$'

[[repos.hooks]]
id = "ty"
name = "ty check"
entry = "uv check"
language = "system"
pass_filenames = false
files = '(\.py|pyproject\.toml|uv\.lock)$'

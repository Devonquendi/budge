[project]
name = "budge"
version = "0.1.0"
description = "Manage personal finances via Akahu"
readme = "README.md"
authors = [
    { name = "James Leslie", email = "contactjamesleslie@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "httpx2>=2.12.0",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.42",
]

[project.scripts]
budge = "budge:main"

[tool.fastapi]
# Enables `uv run fastapi dev`
entrypoint = "budge.server:app"

[tool.alembic]
script_location = "%(here)s/alembic"
prepend_sys_path = ["."]

[tool.vercel]
entrypoint = "server:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ty>=0.0.80",
]

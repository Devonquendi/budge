[project]
name = "thrifty"
version = "0.1.0"
description = "Manage personal finances via Akahu"
readme = "README.md"
authors = [
    { name = "James Leslie", email = "contactjamesleslie@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.12.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
thrifty = "thrifty:main"

[tool.fastapi]
# Lets a bare `uv run fastapi dev` find the ASGI app in the src layout.
entrypoint = "thrifty.server:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

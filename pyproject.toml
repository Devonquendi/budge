[project]
name = "thrifty"
version = "0.1.0"
description = "Manage personal finances via Akahu"
readme = "README.md"
authors = [
    { name = "James Leslie", email = "contactjamesleslie@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.12.0",
]

[project.scripts]
thrifty = "thrifty:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

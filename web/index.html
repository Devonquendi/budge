<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover, or env(safe-area-inset-*) stays 0 on a notched phone. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!--
      The colour a phone tints its browser chrome. One per scheme for the
      system case; theme.svelte.ts puts an unscoped tag in front of these
      when the toggle has been used, since an explicit choice matches neither.
    -->
    <meta name="theme-color" content="#e6e9ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181825" media="(prefers-color-scheme: dark)" />
    <title>Budge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

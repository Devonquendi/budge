{# Shared by onboarding and settings: tick the accounts the dashboard totals. #}
{% for account in accounts %}
<label>
  <input
    type="checkbox"
    name="account_id"
    value="{{ account.id }}"
    {% if account.id in included %}checked{% endif %}
  />
  {{ account.name }}
  <span class="muted">
    {{ account.currency }} {{ "{:,.2f}".format(account.balance_current) }}
  </span>
</label>
{% else %}
<p class="muted">Akahu returned no accounts for these tokens.</p>
{% endfor %}

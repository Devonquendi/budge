{% extends "app.html" %}

{% block title %}dashboard{% endblock %}
{% block tagline %}Your accounts, at a glance{% endblock %}

{% block main %}
<section id="summary">
  <p class="label">Total balance</p>
  <p id="total-balance" class="total" aria-busy="true">Loading&hellip;</p>
</section>

<section>
  <table>
    <thead>
      <tr>
        <th scope="col">Account</th>
        <th scope="col">Connection</th>
        <th scope="col">Type</th>
        <th scope="col" class="balance">Balance</th>
      </tr>
    </thead>
    <tbody id="accounts-body">
      <tr>
        <td colspan="4" aria-busy="true">Loading accounts&hellip;</td>
      </tr>
    </tbody>
  </table>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='dashboard.js') }}"></script>
{% endblock %}

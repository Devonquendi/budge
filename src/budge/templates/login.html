{% extends "form.html" %}

{% block title %}log in{% endblock %}
{% block submit %}Log in{% endblock %}

{% block fields %}
<label>
  Email
  <input type="email" name="email" value="{{ email | default('') }}" autofocus required />
</label>
<label>
  Password
  <input type="password" name="password" required />
</label>
{% endblock %}

{% block footer %}
<p>No account? <a href="/signup">Sign up</a></p>
{% endblock %}

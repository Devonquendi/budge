[settings]
# [deps.*] is still experimental. This lives here rather than in a personal
# config so a fresh clone (CI, or a new machine) can run `mise install`.
experimental = true

[tools]
node = "26.10.0"
pnpm = "12.5.1"
prek = "0.5.3"
python = "3.14.7"
uv = "0.12.17"
vercel = { version = "59.23.2", allow_builds = ["esbuild"], trust_policy_excludes = ["undici"] }

[deps.uv]
dir = "backend"
auto = true

[deps.pnpm]
auto = true
dir = "web"

[env]
# uv keeps the virtualenv in backend/, so point mise at it rather than
# letting it look for one at the repo root.
_.python.venv = { path = "backend/.venv" }

# Secrets stay at the repo root: .env is hand-written, .env.local is written by
# `vercel env pull`. Loaded here so backend and web commands share one source.
_.file = [
    { path = ".env", redact = true },
    { path = ".env.local", redact = true },
]

[hooks]
# `mise install` only installs tools, so finish the job here: git hooks and
# both services' dependencies, leaving a fresh clone ready to run.
postinstall = "prek install && mise deps install"

[tasks."dev:api"]
description = "FastAPI with reload on :8000"
alias = "api"
dir = "backend"
run = "uv run fastapi dev"

[tasks."dev:web"]
description = "Vite dev server on :5173"
alias = "web"
dir = "web"
run = "pnpm dev"

[tasks.dev]
description = "Both dev servers"
run = [{ tasks = ["dev:api", "dev:web"] }]

[tasks."check:api"]
dir = "backend"
run = "uv check"

[tasks."check:web"]
dir = "web"
run = "pnpm check"

[tasks.check]
description = "Type-check both services"
run = [{ tasks = ["check:api", "check:web"] }]

[tasks.build]
description = "Production build of the web app"
dir = "web"
run = "pnpm build"

[tasks.screens]
description = "Screenshot every page at phone, tablet and desktop sizes"
dir = "web"
run = "pnpm screens"
